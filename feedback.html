<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="feedback.css" />
  <body>

    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">Mani's Website</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="feedback.html">Feedback</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="photos.html">Photos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <h2>Feedback Form</h2>

    <form>
      <label for="fullname">Full Name:</label><br />
      <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        minlength="3"
        required
      />
      <br /><br />

      <label for="email">Email Address:</label><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="example@email.com"
        required
      />
      <br /><br />

      <h3>Rating</h3>

      <input
        type="radio"
        id="verysatisfied"
        name="rating"
        value="Very Satisfied"
        required
      />
      <label for="verysatisfied">Very Satisfied</label><br />

      <input type="radio" id="satisfied" name="rating" value="Satisfied" />
      <label for="satisfied">Satisfied</label><br />

      <input type="radio" id="neutral" name="rating" value="Neutral" />
      <label for="neutral">Neutral</label><br />

      <input type="radio" id="unsatisfied" name="rating" value="Unsatisfied" />
      <label for="unsatisfied">Unsatisfied</label><br /><br />

      <h3>Interests</h3>

      <input
        type="checkbox"
        id="webdev"
        name="interest"
        value="Web Development"
      />
      <label for="webdev">Web Development</label><br />

      <input
        type="checkbox"
        id="mobiledev"
        name="interest"
        value="Mobile Development"
      />
      <label for="mobiledev">Mobile Development</label><br />

      <input
        type="checkbox"
        id="ai"
        name="interest"
        value="AI & Machine Learning"
      />
      <label for="ai">AI & Machine Learning</label><br /><br />

      <label for="country">Country:</label><br />
      <select id="country" name="country" required>
        <option value="">Select a Country</option>
        <option value="Nepal">Nepal</option>
        <option value="India">India</option>
        <option value="USA">United States</option>
      </select>
      <br /><br />

      <label for="feedback">Write your feedback here:</label><br />
      <textarea
        id="feedback"
        name="feedback"
        rows="5"
        cols="40"
        placeholder="Write your feedback here"
        maxlength="500"
        required
      ></textarea>
      <br /><br />

      <input type="submit" value="Submit" />
    </form>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
